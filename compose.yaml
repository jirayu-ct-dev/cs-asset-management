name: cs-asset-management

services:
  init:
    build:
      context: .
      target: initializer
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cs_asset_management}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.test}
      ADMIN_NAME: ${ADMIN_NAME:-ผู้ดูแลระบบทดสอบ}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-admin-password-1234}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cs_asset_management}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-local-development-session-password-32-chars}
      NUXT_SESSION_COOKIE_SECURE: ${NUXT_SESSION_COOKIE_SECURE:-false}
      NUXT_PUBLIC_APP_BASE_URL: ${NUXT_PUBLIC_APP_BASE_URL:-http://localhost:3000}
      NUXT_UPLOAD_DIR: /app/storage/uploads
      NUXT_MAX_UPLOAD_SIZE: ${NUXT_MAX_UPLOAD_SIZE:-10485760}
      TZ: ${TZ:-Asia/Bangkok}
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - uploads-data:/app/storage/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cs_asset_management}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-Asia/Bangkok}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  uploads-data:
