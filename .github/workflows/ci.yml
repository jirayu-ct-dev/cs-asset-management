name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NUXT_SESSION_PASSWORD: ci-only-session-password-at-least-32-chars
      NUXT_PUBLIC_APP_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:check
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NUXT_SESSION_PASSWORD: ci-only-session-password-at-least-32-chars
      NUXT_PUBLIC_APP_BASE_URL: http://127.0.0.1:3000
      ADMIN_EMAIL: admin@example.test
      ADMIN_NAME: CI Admin
      ADMIN_PASSWORD: ci-admin-password-1234
      E2E_ADMIN_EMAIL: admin@example.test
      E2E_ADMIN_PASSWORD: ci-admin-password-1234
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm admin:create
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Drill database and upload restore
        run: ./scripts/restore-drill.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: ci
          PGPASSWORD: ci
          PGDATABASE: ci
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
